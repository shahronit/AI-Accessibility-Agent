# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Deploy from the Render dashboard → "New" → "Blueprint" → point to this
# repo. The service will start serving traffic on the very first deploy
# without any manual env var setup, because A11yAgent is GUEST-DEFAULT —
# every route works without signing in. Fill in the `sync: false` keys
# below only for the features you actually want to enable.
#
# What's wired in:
#   - Guest mode             → no auth required for any route (default)
#   - GitHub sign-in (opt-in) → NEXTAUTH_SECRET (auto), GITHUB_ID, GITHUB_SECRET, NEXTAUTH_URL
#   - Upstash rate limiting  → UPSTASH_REDIS_REST_URL/TOKEN  (no-op when unset)
#   - IBM Equal Access       → IBM_CHECKER_ENABLED=true (default; set false to skip)
#   - Scan cache (10-min)    → reuses Upstash creds above
#   - /history + /report/[id] index → reuses Upstash creds above

services:
  - type: web
    name: a11yagent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      # ── Runtime basics ──────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # SQLite path for multi-page scan history. On the free plan there is
      # no persistent disk, so the DB is recreated on every cold start;
      # add a `disks:` entry on a paid plan if you need persistence.
      - key: DB_PATH
        value: /app/data/a11yagent.db

      # ── Auth (optional — guest mode is the default) ─────────────────
      # NEXTAUTH_SECRET is consumed by NextAuth at boot to decode session
      # cookies for users who opt in to /signin. Auto-generated so the
      # service never starts with an empty secret. Rotate by deleting the
      # value in the dashboard and re-deploying — it'll regenerate.
      - key: NEXTAUTH_SECRET
        generateValue: true

      # The three keys below ONLY need to be filled in if you want the
      # GitHub sign-in button on /signin to work. With them unset:
      #   - guest mode keeps working (every route is open)
      #   - /signin renders but the GitHub button fails
      #   - signed-in per-user history bucket is unavailable; everything
      #     persists under the shared "guest" user
      # Render publishes the public URL as RENDER_EXTERNAL_URL once the
      # service is live; set NEXTAUTH_URL to that value (e.g.
      # https://a11yagent.onrender.com) so OAuth callbacks resolve
      # correctly.
      - key: NEXTAUTH_URL
        sync: false
      - key: GITHUB_ID
        sync: false
      - key: GITHUB_SECRET
        sync: false

      # ── AI providers (configure at least one) ───────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false

      # ── Upstash Redis (optional) ────────────────────────────────────
      # Powers per-IP rate limiting, the 10-min scan-result cache, the
      # /api/scan-diff endpoint, and the KV-backed scan history index.
      # When unset, all four degrade gracefully (no 429s, no caching,
      # /api/scan-history returns an empty list).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── IBM Equal Access ────────────────────────────────────────────
      # Default is on. Set to "false" to skip IBM and only use axe-core
      # (saves ~3-5s per scan on cold starts).
      - key: IBM_CHECKER_ENABLED
        value: "true"
