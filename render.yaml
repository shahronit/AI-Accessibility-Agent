# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Deploy from the Render dashboard → "New" → "Blueprint" → point to this
# repo. The service will start serving traffic on the very first deploy
# without any manual env var setup, because A11yAgent is GUEST-DEFAULT —
# every route works without signing in. Fill in the `sync: false` keys
# below only for the features you actually want to enable.
#
# What's wired in:
#   - Guest mode             → no auth required for any route (default)
#   - Firebase Auth (opt-in) → NEXT_PUBLIC_FIREBASE_*, FIREBASE_SERVICE_ACCOUNT_JSON
#   - Firestore (opt-in)     → reuses the same service account
#   - Upstash rate limiting  → UPSTASH_REDIS_REST_URL/TOKEN  (no-op when unset)
#   - IBM Equal Access       → IBM_CHECKER_ENABLED=true (default; set false to skip)
#   - Scan cache (10-min)    → reuses Upstash creds above
#   - /history + /report/[id] index → reuses Upstash creds above

services:
  - type: web
    name: a11yagent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      # ── Runtime basics ──────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"

      # ── Firebase (optional — guest mode is the default) ─────────────
      # The four NEXT_PUBLIC_FIREBASE_* values are inlined into the
      # client bundle at BUILD time. They must be supplied as Docker
      # build args (set as Render env vars below — Render passes them
      # through to `docker build` automatically) AND remain available at
      # runtime.
      #
      # FIREBASE_SERVICE_ACCOUNT_JSON is server-only: paste the entire
      # service-account JSON (single line). Newlines inside the
      # private_key may be backslash-escaped — the app normalizes them.
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # ── AI providers (configure at least one) ───────────────────────
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false

      # ── Upstash Redis (optional) ────────────────────────────────────
      # Powers per-IP rate limiting, the 10-min scan-result cache, the
      # /api/scan-diff endpoint, and the KV-backed scan history index.
      # When unset, all four degrade gracefully (no 429s, no caching,
      # /api/scan-history returns an empty list).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── IBM Equal Access ────────────────────────────────────────────
      # Default is on. Set to "false" to skip IBM and only use axe-core
      # (saves ~3-5s per scan on cold starts).
      - key: IBM_CHECKER_ENABLED
        value: "true"
